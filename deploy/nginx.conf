# Include inside the nginx `http {}` block, or adapt the server block to your site.
server {
    listen 8080;
    server_name _;

    location = /encodec/stream.json {
        alias /opt/encodec-live/public/stream.json;
        default_type application/vnd.encodec.live+json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
    }

    location = /encodec/stream.pb {
        alias /opt/encodec-live/public/stream.pb;
        default_type application/protobuf;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
    }

    location ~ ^/encodec/(segment-[0-9]{12}\.ecdc)$ {
        alias /opt/encodec-live/public/$1;
        default_type audio/x-encodec;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag on;
    }

    location /encodec/ {
        return 404;
    }
}
