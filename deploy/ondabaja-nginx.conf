# Include inside nginx's http {} block or adapt into your HTTPS server.
server {
    listen 8080;
    server_name _;

    # Match server.output_root. Copy these locations into an existing HTTPS
    # server if nginx already handles TLS. Only public media is exposed.
    location = /radios/catalog.pb {
        alias /opt/ondabaja-server/public/catalog.pb;
        default_type application/protobuf;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
    }

    location = /radios/catalog.json {
        alias /opt/ondabaja-server/public/catalog.json;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
    }

    location ~ ^/radios/([^/]+)/stream\.json$ {
        alias /opt/ondabaja-server/public/$1/stream.json;
        default_type application/vnd.encodec.live+json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
    }

    location ~ ^/radios/([^/]+)/stream\.pb$ {
        alias /opt/ondabaja-server/public/$1/stream.pb;
        default_type application/protobuf;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag off;
    }

    location ~ "^/radios/([^/]+)/(segment-[0-9]{12}\.(?:ecdc|ecng))$" {
        alias /opt/ondabaja-server/public/$1/$2;
        default_type audio/x-encodec;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag on;
    }

    location /radios/ {
        return 404;
    }
}
