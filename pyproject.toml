[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ondabaja-server"
version = "0.1.0"
description = "Experimental multi-radio EnCodec Live service for OndaBaja"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EnCodec Live Streamer contributors" }]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/HenryDelMal/ondabaja-server"
Issues = "https://github.com/HenryDelMal/ondabaja-server/issues"

[project.scripts]
encodec-live = "encodec_live_streamer.cli:main"
ondabaja-server = "encodec_live_streamer.ondabaja_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
